[package]
name = "tidytwin"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fagostini/tidytwin"

[dependencies]
blake3 = "1.8.7"
eframe = "0.37.0"
image = "0.25"
image_hasher = "3.1.1"
lofty = "0.25.5"
open = "5.4.5"
rayon = "1.12.0"
reflink-copy = "0.1.33"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
trash = "5.4.0"
walkdir = "2.5.0"

[package.metadata.deb]
maintainer = "Federico Agostini"
copyright = "Federico Agostini"
extended-description = "Duplicate file finder with GUI and CLI."
assets = [
    ["target/release/tidytwin", "usr/bin/", "755"],
    ["packaging/tidytwin.desktop", "usr/share/applications/", "644"],
    ["packaging/tidytwin.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
